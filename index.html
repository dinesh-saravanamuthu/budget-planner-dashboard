<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Planner</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Budget Planner</h1><p>Track monthly income, expenses and savings.</p><input type="month" id="month"></header><main><section class="cards"><article>Income <b id="income">₹0</b></article><article>Expenses <b id="expense">₹0</b></article><article>Balance <b id="balance">₹0</b></article></section><section class="panel"><h2>Add transaction</h2><form id="form"><input id="desc" placeholder="Description" required><input id="amount" type="number" min="1" placeholder="Amount ₹" required><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><select id="cat"><option>Food</option><option>Travel</option><option>Education</option><option>Health</option><option>Shopping</option><option>Salary</option><option>Other</option></select><input id="date" type="date" required><button>Add</button></form></section><section class="panel"><h2>Spending by category</h2><canvas id="chart" width="600" height="260"></canvas></section><section class="panel"><h2>Transactions</h2><div id="list"></div></section><section class="panel"><h2>Savings goal</h2><input id="goal" type="number" value="10000" min="0"><div class="track"><i id="progress"></i></div><p id="goalText"></p></section></main><script src="script.js"></script></body></html>
